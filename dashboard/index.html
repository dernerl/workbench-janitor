<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🧹 Workbench Janitor</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73;
    --border: #e5e5ea;
    --green: #34c759; --red: #ff3b30; --yellow: #ffcc00; --orange: #ff9500; --blue: #007aff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1e; --card: #2c2c2e; --text: #f5f5f7; --muted: #98989d; --border: #3a3a3c; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  }
  header { max-width: 1100px; margin: 0 auto 20px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: 13px; }
  .filters { max-width: 1100px; margin: 0 auto 16px; display: flex; flex-wrap: wrap; gap: 8px; }
  .filters button {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer;
  }
  .filters button.active { background: var(--blue); color: #fff; border-color: var(--blue); }
  .grid {
    max-width: 1100px; margin: 0 auto; display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; display: flex; flex-direction: column; gap: 6px;
  }
  .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .name { font-weight: 600; font-size: 15px; word-break: break-word; }
  .age { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px;
    border-radius: 999px; color: #fff; width: fit-content;
  }
  .desc { font-size: 13px; color: var(--text); }
  .desc.empty { color: var(--muted); font-style: italic; }
  .rec { font-size: 12px; color: var(--muted); }
  .links { display: flex; gap: 10px; margin-top: 4px; }
  .links a { font-size: 12px; color: var(--blue); text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  .backend-tag { font-size: 10px; color: var(--muted); }
  .empty-state { max-width: 1100px; margin: 40px auto; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>🧹 Workbench Janitor</h1>
  <div class="meta" id="meta">lädt …</div>
</header>
<div class="filters" id="filters"></div>
<div class="grid" id="grid"></div>
<div class="empty-state" id="empty" style="display:none">Keine Ordner in dieser Kategorie.</div>

<script>
const CATS = {
  "remote-gone":   { label: "🔴 Remote fehlt",        color: "var(--red)" },
  "synced-stale":  { label: "🟢 Löschbar",             color: "var(--green)" },
  "dirty":         { label: "🟡 Ungesichert",          color: "var(--yellow)" },
  "no-remote":     { label: "🟠 Ohne Remote",          color: "var(--orange)" },
  "local-stale":   { label: "🔵 Nur lokal & alt",      color: "var(--blue)" },
  "synced-active": { label: "✅ Aktiv (gesichert)",    color: "var(--muted)" },
  "local-active":  { label: "✅ Aktiv (lokal)",        color: "var(--muted)" },
};

let state = null, descriptions = {}, activeFilter = null;

function fileUrl(path) {
  return "file://" + path.split("/").map(encodeURIComponent).join("/");
}

function render() {
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  grid.innerHTML = "";
  const workbench = state.workbench;
  const projects = (state.projects || [])
    .filter(p => !activeFilter || p.category === activeFilter)
    .sort((a, b) => b.age_days - a.age_days);

  empty.style.display = projects.length ? "none" : "block";

  for (const p of projects) {
    const cat = CATS[p.category] || { label: p.category, color: "var(--muted)" };
    const d = descriptions[p.name];
    const card = document.createElement("div");
    card.className = "card";
    const descHtml = d
      ? `<div class="desc">${escapeHtml(d.description)}</div><div class="backend-tag">${d.backend === "apple" ? "🍎 on-device" : "☁️ " + d.backend}</div>`
      : `<div class="desc empty">keine Beschreibung</div>`;
    card.innerHTML = `
      <div class="card-top">
        <span class="name">${escapeHtml(p.name)}</span>
        <span class="age">${p.age_days}d</span>
      </div>
      <span class="badge" style="background:${cat.color}">${cat.label}</span>
      ${descHtml}
      <div class="rec">${escapeHtml(p.recommendation || "")}</div>
      <div class="links">
        <a href="${fileUrl(workbench + "/" + p.name)}">Ordner öffnen</a>
        <a href="reports/latest.md">Report</a>
      </div>
    `;
    grid.appendChild(card);
  }
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function renderFilters() {
  const bar = document.getElementById("filters");
  const counts = {};
  for (const p of state.projects || []) counts[p.category] = (counts[p.category] || 0) + 1;

  const allBtn = mkFilterBtn(null, `Alle (${(state.projects || []).length})`);
  bar.appendChild(allBtn);
  for (const [cat, info] of Object.entries(CATS)) {
    if (!counts[cat]) continue;
    bar.appendChild(mkFilterBtn(cat, `${info.label} (${counts[cat]})`));
  }
}

function mkFilterBtn(cat, label) {
  const btn = document.createElement("button");
  btn.textContent = label;
  if (cat === activeFilter) btn.classList.add("active");
  btn.onclick = () => { activeFilter = cat; renderFilters(); render(); };
  return btn;
}

async function load() {
  const [stateRes, descRes] = await Promise.all([
    fetch("../state.json").catch(() => null),
    fetch("../descriptions.json").catch(() => null),
  ]);
  state = stateRes && stateRes.ok ? await stateRes.json() : { projects: [], workbench: "" };
  descriptions = descRes && descRes.ok ? await descRes.json() : {};

  document.getElementById("meta").textContent =
    `Workbench: ${state.workbench || "?"} · Stand ${(state.generated || "?").slice(0, 16).replace("T", " ")} · ${(state.projects || []).length} Ordner`;

  document.getElementById("filters").innerHTML = "";
  renderFilters();
  render();
}

load();
</script>
</body>
</html>
